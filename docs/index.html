<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Didinska AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2F8;--panel:#EAE6F2;--ink:#2E2A3B;--mute:#7A7589;--line:#DDD8E8;--accent:#6F5FE0;--onaccent:#fff;--bot:#FBFAFD;--r:14px;
--head:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1C1A26;--panel:#232031;--ink:#E9E6F2;--mute:#9C97AD;--line:#322E44;--accent:#A99BFF;--onaccent:#1C1A26;--bot:#262335}}
:root[data-theme=dark]{--bg:#1C1A26;--panel:#232031;--ink:#E9E6F2;--mute:#9C97AD;--line:#322E44;--accent:#A99BFF;--onaccent:#1C1A26;--bot:#262335}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);display:flex;overflow:hidden}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{width:272px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;padding-top:max(16px,env(safe-area-inset-top));flex-shrink:0;transition:transform .2s}
.brand{font:700 22px/1 var(--head);padding:4px 8px 16px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.new{background:var(--accent);color:var(--onaccent);border:0;border-radius:10px;padding:10px 14px;text-align:left;font-weight:600}
#list{flex:1;overflow:auto;margin:16px 0;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:6px;border-radius:8px;padding:8px 10px;color:var(--mute);background:none;border:0;text-align:left;width:100%}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover{background:var(--line)}
.item.on{background:var(--bg);color:var(--ink);font-weight:500}
.item .x{opacity:0;color:var(--mute);padding:0 4px}
.item:hover .x,.item.on .x{opacity:1}
.side-foot{display:flex;gap:8px}
.ghost{flex:1;background:none;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--mute)}
.ghost:hover{color:var(--ink);border-color:var(--mute)}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top button{background:none;border:0;font-size:22px;line-height:1}
.top b{font-family:var(--head)}
#scroll{flex:1;overflow:auto}
.col{max-width:760px;margin:0 auto;padding:24px 20px}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.empty h1{font:700 clamp(34px,6vw,56px)/1.05 var(--head);letter-spacing:-.03em;margin:0 0 12px;max-width:14ch}
.empty p{color:var(--mute);margin:0 0 28px;max-width:46ch}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sug{background:var(--bot);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;line-height:1.4}
.sug:hover{border-color:var(--accent)}
.sug small{display:block;color:var(--mute);margin-top:4px}
.msg{display:flex;gap:12px;margin:0 0 22px}
.msg.user{justify-content:flex-end}
.msg .b{max-width:100%;overflow-wrap:anywhere}
.msg.user .b{background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:82%;white-space:pre-wrap}
.msg.bot .av{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font:700 15px var(--head);flex-shrink:0;margin-top:2px}
.msg.bot .b{flex:1;min-width:0}
.b p{margin:0 0 .8em}.b p:last-child{margin:0}
.b code{font:13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--panel);padding:2px 5px;border-radius:5px}
.b pre{background:var(--bot);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0 0 .8em}
.b pre code{background:none;padding:0}
.cur::after{content:'';display:inline-block;width:8px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.err{color:#D2392F;border:1px solid currentColor;border-radius:10px;padding:10px 14px}
form.comp{padding:8px 20px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.box{max-width:760px;margin:0 auto;background:var(--bot);border:1px solid var(--line);border-radius:20px;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px}
.box:focus-within{border-color:var(--accent)}
textarea{flex:1;border:0;background:none;resize:none;outline:0;max-height:200px;padding:8px 0;line-height:1.5}
#send{width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);color:var(--onaccent);font-size:18px;flex-shrink:0}
#send:disabled{opacity:.35;cursor:default}
.note{text-align:center;color:var(--mute);font-size:12.5px;margin:8px 0 0}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);padding:24px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font:700 22px var(--head);margin:0 0 16px}
dialog label{display:block;font-weight:500;margin:12px 0 4px}
dialog input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bot)}
dialog small{color:var(--mute);display:block;margin-top:4px;line-height:1.4}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.acts button{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:none}
.acts .pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
.cb{border:1px solid var(--line);border-radius:10px;margin:0 0 .8em;overflow:hidden;background:var(--bot)}
.ch{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;background:var(--panel);font-size:13px}
.ch span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.ch button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 10px;font-size:13px}
.ch button:hover{border-color:var(--accent)}
.cb pre{border:0;border-radius:0;margin:0}
.chips{max-width:760px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.clip{width:40px;height:40px;border-radius:12px;border:0;background:none;font-size:20px;color:var(--mute);flex-shrink:0}
.clip:hover{color:var(--accent)}
.zipall{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:10px;padding:6px 14px;font-weight:500}
.lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.lock.on{display:flex}
.lock form{width:min(340px,100%)}
.lock h1{font:700 34px/1.1 var(--head);letter-spacing:-.03em;margin:0 0 8px}
.lock p{color:var(--mute);margin:0 0 20px}
.lock input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bot);font-size:22px;letter-spacing:.4em;text-align:center}
.lock button{width:100%;margin-top:12px;padding:13px;border-radius:14px;border:0;background:var(--accent);color:var(--onaccent);font-weight:600}
.lock .e{color:#D2392F;min-height:1.5em;margin:10px 0 0;font-size:14px;text-align:center}
@media(max-width:760px){
 aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%)}
 body.open aside{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.25)}
 .top{display:flex}
 .msg.user .b{max-width:90%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="lock" id="lock">
 <form id="lf">
  <h1>Masukkan PIN</h1>
  <p>Situs ini hanya untuk pemilik.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" maxlength="32">
  <button type="submit">Masuk</button>
  <p class="e" id="le" role="alert"></p>
 </form>
</div>
<aside>
 <div class="brand">didinska<i>.ai</i></div>
 <button class="new" id="new">+ Obrolan baru</button>
 <div id="list"></div>
 <div class="side-foot">
  <button class="ghost" id="theme">Tema</button>
  <button class="ghost" id="cfg">Pengaturan</button>
 </div>
</aside>
<main>
 <div class="top"><button id="menu" aria-label="Buka menu">☰</button><b>didinska.ai</b></div>
 <div id="scroll"><div class="col" id="chat"></div></div>
 <form class="comp" id="form">
  <div class="chips" id="chips"></div>
  <input type="file" id="fi" multiple hidden accept=".js,.mjs,.ts,.jsx,.tsx,.py,.txt,.md,.json,.html,.css,.mq5,.mq4,.mqh,.cpp,.c,.h,.cs,.java,.go,.rs,.php,.sh,.sql,.yml,.yaml,.env,.ini,.csv,.log,.lua,.rb,.kt,.swift,.xml,text/*">
  <div class="box">
   <button type="button" class="clip" id="clip" aria-label="Lampirkan file">📎</button>
   <textarea id="in" rows="1" placeholder="Tulis pesan atau lampirkan kode…" aria-label="Pesan"></textarea>
   <button id="send" type="submit" aria-label="Kirim" disabled>↑</button>
  </div>
  <p class="note">AI bisa salah. Cek ulang info penting.</p>
 </form>
</main>

<dialog id="dlg">
 <h2>Pengaturan API</h2>
 <label for="u">URL API</label>
 <input id="u" placeholder="https://api.domainmu.com/v1/chat/completions">
 <label for="m">Nama model</label>
 <input id="m" placeholder="nama-model">
 <label for="k">API key (opsional)</label>
 <input id="k" type="password" placeholder="sk-…">
 <small>Untuk situs publik, jangan simpan key di browser. Arahkan URL ke backend/proxy milikmu sendiri yang menyimpan key di server.</small>
 <div class="acts"><button id="cx">Batal</button><button class="pri" id="sv">Simpan</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const SUG=[["Buat skrip","Buatkan skrip Python untuk rename banyak file sekaligus"],["Cari bug","Cari bug di kode yang akan saya lampirkan"],["Jelaskan kode","Jelaskan cara kerja kode yang saya lampirkan"],["Buat proyek","Buatkan proyek Node.js dengan Express lengkap dengan semua filenya"]];
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const API='https://web-chatbot.mr-didinska21.workers.dev';
const auth=()=>{const t=ls.get('tok',null);return t?{Authorization:'Bearer '+t}:{}};
let cfg=ls.get('cfg',{url:'/api/chat',model:'',key:''});
let chats=ls.get('chats',[]);
let cur=null,busy=false,ctl=null,files=[];
const SYS='Kamu asisten coding. Jawab dalam bahasa Indonesia, ringkas dan teknis. Berikan kode lengkap yang siap dijalankan, jangan dipotong dengan tanda titik-titik. Tulis setiap file dalam blok kode terpisah dengan format ```bahasa:namafile.ext (contoh ```python:bot.py atau ```mq5:EA.mq5). Jika ada file terlampir, rujuk namanya.';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EXT={python:'py',py:'py',javascript:'js',js:'js',node:'js',nodejs:'js',typescript:'ts',ts:'ts',mq5:'mq5',mql5:'mq5',mq4:'mq4',mql4:'mq4',cpp:'cpp','c++':'cpp',c:'c',cs:'cs',csharp:'cs',java:'java',go:'go',rust:'rs',php:'php',json:'json',html:'html',css:'css',bash:'sh',sh:'sh',sql:'sql',yaml:'yml',yml:'yml',markdown:'md',md:'md',text:'txt',txt:'txt',env:'env',ini:'ini'};
function codeBlock(info,code){
 const lang=(info.split(/[\s:]/)[0]||'').toLowerCase();
 let name=(info.match(/[\w\-]+\.[A-Za-z0-9]+/)||[])[0];
 if(!name)name='kode.'+(EXT[lang]||lang||'txt');
 return '<div class="cb"><div class="ch"><span>'+esc(name)+'</span><button type="button" data-a="copy">Salin</button><button type="button" data-a="dl" data-n="'+esc(name)+'">Unduh</button></div><pre><code>'+esc(code)+'</code></pre></div>';
}
function md(t){
 const parts=t.split(/```/);
 return parts.map((p,i)=>{
  if(i%2){const nl=p.indexOf('\n');return codeBlock(nl>-1?p.slice(0,nl).trim():'',nl>-1?p.slice(nl+1):p)}
  return p.split(/\n{2,}/).filter(x=>x.trim()).map(x=>'<p>'+esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>').join('');
 }).join('')+(parts.length>=5&&parts.length%2===1?'<button type="button" class="zipall" data-a="zip">Unduh semua (.zip)</button>':'');
}
function renderChips(){const c=$('#chips');c.innerHTML='';files.forEach((f,i)=>{const x=document.createElement('span');x.className='chip';x.textContent=f.name+' ✕';x.onclick=()=>{files.splice(i,1);renderChips();fit()};c.appendChild(x)})}
$('#clip').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{for(const f of e.target.files){if(f.size>300000){alert(f.name+' terlalu besar (maks 300 KB).');continue}const t=await f.text();if(t.includes('\u0000')){alert(f.name+' bukan file teks/kode.');continue}files.push({name:f.name,text:t})}e.target.value='';renderChips();fit()};
async function zipAll(btn){
 if(!window.JSZip){alert('Library zip belum termuat. Coba lagi.');return}
 const z=new JSZip(),seen={};
 btn.parentElement.querySelectorAll('.cb').forEach(cb=>{const raw=cb.querySelector('.ch span').textContent;seen[raw]=(seen[raw]||0)+1;let n=raw;if(seen[raw]>1){const i=raw.lastIndexOf('.');n=i>0?raw.slice(0,i)+'_'+seen[raw]+raw.slice(i):raw+'_'+seen[raw]}z.file(n,cb.querySelector('code').textContent)});
 const blob=await z.generateAsync({type:'blob'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kode.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function save(){ls.set('chats',chats)}
function renderList(){
 $('#list').innerHTML='';
 chats.forEach(c=>{
  const b=document.createElement('button');b.className='item'+(c===cur?' on':'');
  b.innerHTML='<span>'+esc(c.title)+'</span><span class="x" role="button" aria-label="Hapus">✕</span>';
  b.onclick=e=>{if(e.target.classList.contains('x')){chats=chats.filter(x=>x!==c);if(cur===c)cur=null;save();renderList();renderChat()}else{cur=c;renderList();renderChat();document.body.classList.remove('open')}};
  $('#list').appendChild(b);
 });
}
function renderChat(){
 const el=$('#chat');el.innerHTML='';
 if(!cur||!cur.msgs.length){
  el.className='col empty';
  el.innerHTML='<h1>Mau bikin kode apa hari ini?</h1><p>Tulis permintaan atau lampirkan kode. Obrolanmu tersimpan di perangkat ini.</p><div class="sugs"></div>';
  SUG.forEach(([a,q])=>{const b=document.createElement('button');b.className='sug';b.innerHTML=esc(a)+'<small>'+esc(q)+'</small>';b.onclick=()=>send(q);el.lastChild.appendChild(b)});
  return;
 }
 el.className='col';
 cur.msgs.forEach(m=>addMsg(m.role,m.show??m.content,m.files));
 $('#scroll').scrollTop=1e9;
}
function addMsg(role,text,fl){
 const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');
 d.innerHTML=(role==='user'?'':'<div class="av">D</div>')+'<div class="b"></div>';
 const b=d.querySelector('.b');
 if(role==='user')b.textContent=(fl&&fl.length?fl.map(n=>'📎 '+n).join('\n')+'\n':'')+text;else b.innerHTML=md(text);
 $('#chat').appendChild(d);return b;
}
async function send(text){
 text=text.trim();if((!text&&!files.length)||busy)return;
 const att=files.splice(0);renderChips();
 const full=att.map(f=>'Berkas: '+f.name+'\n```\n'+f.text+'\n```').join('\n\n')+(att.length&&text?'\n\n':'')+text;
 const show=text||'(berkas terlampir)';
 if(!cur){cur={title:(text||att[0].name).slice(0,40),msgs:[]};chats.unshift(cur)}
 cur.msgs.push({role:'user',content:full,show,files:att.map(f=>f.name)});
 save();renderList();
 if(cur.msgs.length===1)renderChat();else addMsg('user',show,att.map(f=>f.name));
 if($('#chat').classList.contains('empty'))renderChat();
 $('#in').value='';fit();setBusy(true);
 const b=addMsg('assistant','');b.classList.add('cur');
 $('#scroll').scrollTop=1e9;
 let out='';ctl=new AbortController();
 try{
  const res=await fetch(API+'/api/chat',{method:'POST',signal:ctl.signal,
   headers:{'Content-Type':'application/json',...auth()},
   body:JSON.stringify({model:cfg.model||undefined,stream:true,messages:[{role:'system',content:SYS},...cur.msgs.map(({role,content})=>({role,content}))]})});
  if(res.status===401){ls.set('tok',null);showLock();throw new Error('Sesi berakhir. Masukkan PIN lagi.')}
  if(!res.ok)throw new Error('Server menjawab '+res.status+'. Periksa URL dan key di Pengaturan.');
  const ct=res.headers.get('content-type')||'';
  if(ct.includes('event-stream')){
   const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
   for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){
     if(!l.startsWith('data:'))continue;const p=l.slice(5).trim();if(!p||p==='[DONE]')continue;
     try{const j=JSON.parse(p);out+=j.choices?.[0]?.delta?.content??j.delta?.text??''}catch{}
    }
    b.innerHTML=md(out);b.classList.add('cur');$('#scroll').scrollTop=1e9;
   }
  }else{
   const j=await res.json();
   out=j.choices?.[0]?.message?.content??j.content?.[0]?.text??j.reply??j.text??JSON.stringify(j);
  }
  b.classList.remove('cur');b.innerHTML=md(out||'(kosong)');
  cur.msgs.push({role:'assistant',content:out});save();
 }catch(e){
  b.classList.remove('cur');
  if(e.name==='AbortError'){if(out){cur.msgs.push({role:'assistant',content:out});save()}}
  else{b.innerHTML='<div class="err">'+esc(e.message||'Gagal terhubung ke API.')+'</div>';cur.msgs.pop();save()}
 }
 setBusy(false);$('#scroll').scrollTop=1e9;
}
function setBusy(v){busy=v;$('#send').textContent=v?'■':'↑';$('#send').disabled=!v&&!$('#in').value.trim()&&!files.length}
function fit(){const t=$('#in');t.style.height='auto';t.style.height=t.scrollHeight+'px';$('#send').disabled=!busy&&!t.value.trim()&&!files.length}
$('#in').addEventListener('input',fit);
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(max-width:760px)').matches){e.preventDefault();$('#form').requestSubmit()}});
$('#form').onsubmit=e=>{e.preventDefault();if(busy){ctl&&ctl.abort();return}send($('#in').value)};
$('#new').onclick=()=>{cur=null;renderList();renderChat();document.body.classList.remove('open');$('#in').focus()};
$('#menu').onclick=()=>document.body.classList.toggle('open');
$('#scroll').onclick=()=>document.body.classList.remove('open');
$('#theme').onclick=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;const now=r.dataset.theme||(d?'dark':'light');const n=now==='dark'?'light':'dark';r.dataset.theme=n;ls.set('theme',n)};
if(ls.get('theme',null))document.documentElement.dataset.theme=ls.get('theme');
$('#cfg').onclick=()=>{$('#u').value=cfg.url;$('#m').value=cfg.model;$('#k').value=cfg.key;$('#dlg').showModal()};
$('#cx').onclick=()=>$('#dlg').close();
$('#sv').onclick=()=>{cfg={url:$('#u').value.trim(),model:$('#m').value.trim(),key:$('#k').value.trim()};ls.set('cfg',cfg);$('#dlg').close()};
$('#chat').addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 if(b.dataset.a==='zip'){zipAll(b);return}
 const code=b.closest('.cb').querySelector('code').textContent;
 if(b.dataset.a==='copy'){navigator.clipboard.writeText(code).then(()=>{b.textContent='Tersalin';setTimeout(()=>b.textContent='Salin',1500)}).catch(()=>{})}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain;charset=utf-8'}));a.download=b.dataset.n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
});
function showLock(){$('#lock').classList.add('on');$('#pin').value='';setTimeout(()=>$('#pin').focus(),50)}
$('#lf').onsubmit=async e=>{
 e.preventDefault();$('#le').textContent='';
 try{
  const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('#pin').value})});
  if(r.ok){const j=await r.json();ls.set('tok',j.token);$('#lock').classList.remove('on');$('#in').focus()}
  else{$('#le').textContent='PIN salah. Coba lagi.';$('#pin').value='';$('#pin').focus()}
 }catch{$('#le').textContent='Tidak bisa terhubung ke server.'}
};
fetch(API+'/api/session',{headers:auth()}).then(r=>{if(r.status===401)showLock()}).catch(()=>{});
renderList();renderChat();
