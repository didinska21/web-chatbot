<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>didinska</title>
<meta name="theme-color" content="#E8F8FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F232A" media="(prefers-color-scheme: dark)">
<style>
@font-face{font-family:'Space Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/space-mono-400.woff2) format('woff2')}
@font-face{font-family:'Space Mono';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/space-mono-700.woff2) format('woff2')}
:root{--bg:#E8F8FD;--sf:#FFFFFF;--sf2:#D3EFF9;--bd:rgba(31,35,42,.12);--tx:#1F232A;--mu:#4F6270;--a:#60DAFB;--ac:#0A8FB0;--on:#10202A;--sh:0 14px 40px rgba(31,35,42,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#1F232A;--sf:#252A32;--sf2:#2F353F;--bd:rgba(255,255,255,.1);--tx:#EEF2F6;--mu:#8B95A3;--a:#60DAFB;--ac:#60DAFB;--on:#0B1217;--sh:0 18px 48px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{min-height:100dvh;font:14px/1.6 'Space Mono',ui-monospace,monospace;background:var(--bg);color:var(--tx);display:grid;place-items:center;
  padding:calc(1.5rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) calc(1.25rem + env(safe-area-inset-left));
  background-image:radial-gradient(60rem 30rem at 50% -10%,color-mix(in srgb,var(--a) 22%,transparent),transparent);background-repeat:no-repeat}
main{width:100%;max-width:56rem}
.top{margin-bottom:1.5rem}
.top small{color:var(--mu);letter-spacing:.12em;text-transform:uppercase;font-size:.75rem}
.top h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.15;margin-top:.35rem;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:2.5rem;min-height:15rem;padding:1.5rem;border-radius:22px;text-decoration:none;color:inherit;
  background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);transition:transform .2s ease;
  opacity:0;animation:up .5s ease-out forwards}
.card:nth-child(2){animation-delay:.1s}
.card.main{background:var(--a);color:var(--on);border-color:transparent}
.card:hover{transform:translateY(-4px)}
.card:active{transform:translateY(-1px)}
.card:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.ico{width:3rem;height:3rem;display:grid;place-items:center;border-radius:14px;background:var(--sf2)}
.card.main .ico{background:rgba(255,255,255,.45)}
.ico svg{width:1.6rem;height:1.6rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h2{font-size:1.6rem;line-height:1.1;letter-spacing:-.02em}
.card p{margin-top:.5rem;font-size:.85rem;color:var(--mu)}
.card.main p{color:inherit;opacity:.8}
.go{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-top:1.25rem}
.go span{display:inline-block;transition:transform .2s ease}
.card:hover .go span{transform:translateX(6px)}
.foot{margin-top:1.5rem;text-align:center;color:var(--mu);font-size:.75rem}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transition:none}.go span{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <small>didinska.my.id</small>
    <h1>Mau buka yang mana?</h1>
  </div>
  <div class="grid">
    <a class="card main" href="ai/">
      <div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg></div>
      <div>
        <h2>didinska ai</h2>
        <p>Asisten coding, chart XAU/USD, dan analisa AI. Masuk dengan PIN.</p>
        <div class="go">Buka <span>→</span></div>
      </div>
    </a>
    <a class="card" href="upscale/">
      <div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="14" height="14" rx="2"/><path d="M3 14l4-4 4 4 2-2 4 4M21 3v6m0-6h-6m6 0l-5 5"/></svg></div>
      <div>
        <h2>upscale WA</h2>
        <p>Foto dan video jadi HD 1080×1920 supaya story WhatsApp tidak pecah.</p>
        <div class="go">Buka <span>→</span></div>
      </div>
    </a>
  </div>
  <p class="foot">didinska</p>
</main>
</body>
</html>
