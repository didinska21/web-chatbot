<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>didinska.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('theme'))||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}catch{document.documentElement.dataset.theme='dark'}</script>
<style>
:root{--bg:#0a0a11;--sf:#12121c;--sf2:#1b1b2a;--bd:rgba(255,255,255,.08);--tx:#ededf5;--mu:#8a8aa3;--a1:#7c5cff;--g:linear-gradient(135deg,#7c5cff,#38b6ff);--sh:0 12px 40px rgba(0,0,0,.4)}
[data-theme=light]{--bg:#f5f5fa;--sf:#fff;--sf2:#eeeef7;--bd:rgba(20,20,50,.1);--tx:#15152b;--mu:#68688a;--sh:0 12px 32px rgba(40,40,90,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.65 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 360px at 85% -5%,rgba(124,92,255,.2),transparent 70%),radial-gradient(500px 320px at 0 100%,rgba(56,182,255,.1),transparent 70%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.logo{font:700 21px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.logo i,.empty em{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#app{position:relative;display:flex;height:100dvh}
#side{width:272px;flex:none;display:flex;flex-direction:column;gap:14px;padding:calc(20px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:var(--sf);border-right:1px solid var(--bd);z-index:6;transition:transform .25s}
#new{padding:12px;border-radius:14px;background:var(--g);color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(124,92,255,.35);transition:transform .15s,filter .15s}
#new:hover{filter:brightness(1.1)}#new:active{transform:scale(.98)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;color:var(--mu);text-align:left;font-size:14px}
.item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.item.on{background:var(--sf2);color:var(--tx)}
.item .x{opacity:.5;padding:0 4px}.item .x:hover{opacity:1;color:#ff6b81}
#theme{padding:10px;border-radius:12px;border:1px solid var(--bd);color:var(--mu);font-size:14px}#theme:hover{color:var(--tx)}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
header{display:none;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--bd);background:var(--bg)}
#menu{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--tx)}#menu:active{background:var(--sf2)}
#ov{display:none}
#scroll{flex:1;overflow-y:auto}
.col{max-width:780px;margin:0 auto;padding:28px 18px 12px}
.msg{display:flex;gap:12px;margin:22px 0;animation:in .3s ease}
.msg.user{justify-content:flex-end}
.msg.user .b{background:var(--sf2);border:1px solid var(--bd);padding:10px 15px;border-radius:18px 18px 5px 18px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.av{width:32px;height:32px;border-radius:11px;background:var(--g);color:#fff;font:700 15px 'Bricolage Grotesque',sans-serif;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(124,92,255,.4)}
.bot .b{flex:1;min-width:0;word-break:break-word}
.b p{margin:0 0 .7em}.b h2,.b h3,.b h4{font-family:'Bricolage Grotesque',sans-serif;margin:1em 0 .4em;letter-spacing:-.01em}
.b ul,.b ol{padding-left:1.3em;margin:0 0 .7em}.b li{margin:.15em 0}
.b code{background:var(--sf2);padding:.12em .42em;border-radius:6px;font:.86em 'JetBrains Mono',monospace}
.cb{margin:.9em 0;border-radius:14px;overflow:hidden;background:#0d0d16;border:1px solid rgba(255,255,255,.09);box-shadow:var(--sh)}
.ch{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 14px;background:#161624;color:#a3a3bd;font:500 12px 'JetBrains Mono',monospace}
.ch span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch button{padding:4px 10px;border-radius:8px;color:#c4c4dc;background:rgba(255,255,255,.06);font:500 12px Figtree,sans-serif}.ch button:hover{background:rgba(255,255,255,.12)}
.cb pre{margin:0;padding:14px;overflow-x:auto}
.cb code{background:none;padding:0;color:#d6d6e7;font:13px/1.7 'JetBrains Mono',monospace;white-space:pre}
.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:#c792ea}.hljs-string,.hljs-regexp,.hljs-addition{color:#c3e88d}.hljs-number,.hljs-symbol,.hljs-bullet{color:#f78c6c}.hljs-comment,.hljs-quote{color:#6b7394;font-style:italic}.hljs-title,.hljs-function{color:#82aaff}.hljs-built_in,.hljs-type,.hljs-attr,.hljs-class .hljs-title{color:#ffcb6b}.hljs-variable,.hljs-params,.hljs-template-variable,.hljs-name,.hljs-tag{color:#f07178}.hljs-meta,.hljs-attribute{color:#89ddff}.hljs-deletion{color:#ff5370}
.zipall{margin-top:4px;padding:9px 15px;border-radius:12px;background:var(--sf2);border:1px solid var(--bd);font-size:13px}.zipall:hover{border-color:var(--a1)}
.cur::after{content:"";display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-.15em;border-radius:2px;background:var(--a1);animation:bl 1s steps(2) infinite}
.dots i{display:inline-block;width:7px;height:7px;margin:12px 3px;border-radius:50%;background:var(--a1);animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.err{color:#ff6b81;padding:10px 14px;border:1px solid rgba(255,107,129,.4);border-radius:12px;background:rgba(255,107,129,.08)}
@keyframes bl{50%{opacity:0}}@keyframes dt{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-bottom:6vh}
.empty h1{font:700 clamp(28px,6vw,42px)/1.15 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em}
.empty p{color:var(--mu);margin:10px 0 26px}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;text-align:left}
.sug{padding:14px 16px;border-radius:16px;background:var(--sf);border:1px solid var(--bd);transition:transform .15s,border-color .15s}
.sug:hover{transform:translateY(-2px);border-color:rgba(124,92,255,.55)}.sug b{display:block;font-weight:600}.sug small{color:var(--mu);font-size:13px}
footer{width:100%;max-width:812px;margin:0 auto;padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{padding:4px 11px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);font-size:13px;cursor:pointer}
#form{display:flex;align-items:flex-end;gap:6px;padding:8px;background:var(--sf);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
#form:focus-within{border-color:rgba(124,92,255,.65);box-shadow:0 0 0 4px rgba(124,92,255,.15),var(--sh)}
#clip{width:40px;height:40px;border-radius:14px;color:var(--mu);display:grid;place-items:center}#clip:hover{color:var(--tx);background:var(--sf2)}
#in{flex:1;resize:none;border:0;outline:0;background:none;padding:9px 4px;max-height:200px;line-height:1.5;font-size:16px}
#send{width:40px;height:40px;border-radius:14px;background:var(--g);color:#fff;font-size:18px;font-weight:700;transition:opacity .2s,transform .15s}
#send:disabled{opacity:.35;cursor:default}#send:not(:disabled):active{transform:scale(.94)}
footer small{display:block;text-align:center;color:var(--mu);font-size:12px;margin-top:8px}
#lock{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:var(--bg)}#lock.on{display:grid}
#lf{width:100%;max-width:360px;padding:34px 26px;border-radius:26px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);text-align:center;display:flex;flex-direction:column;gap:14px}
#lf p{color:var(--mu);font-size:14px}
#pin{padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);text-align:center;font-size:18px;outline:0}#pin:focus{border-color:var(--a1);box-shadow:0 0 0 4px rgba(124,92,255,.18)}
#lf button{padding:13px;border-radius:14px;background:var(--g);color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(124,92,255,.35)}
#le{color:#ff6b81;font-size:13px;min-height:1.2em}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(128,128,160,.3);border-radius:8px}
@media(max-width:760px){
header{display:flex}
#side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}
body.open #side{transform:none;box-shadow:var(--sh)}
#ov{display:block;position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
body.open #ov{opacity:1;pointer-events:auto}
.col{padding-top:18px}
}
</style></head>
<body>
<div id="lock"><form id="lf" autocomplete="off"><div class="logo">didinska<i>.ai</i></div><p>Masukkan PIN untuk masuk</p><input id="pin" type="password" placeholder="••••••" aria-label="PIN"><button>Masuk</button><div id="le"></div></form></div>
<div id="app">
<aside id="side"><div class="logo">didinska<i>.ai</i></div><button id="new">+ Obrolan baru</button><div id="list"></div><button id="theme"></button></aside>
<div id="ov"></div>
<main>
<header><button id="menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><div class="logo">didinska<i>.ai</i></div></header>
<div id="scroll"><div id="chat" class="col"></div></div>
<footer><div id="chips"></div>
<form id="form"><button type="button" id="clip" aria-label="Lampirkan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.6l-9.2 9.2a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.5-8.5"/></svg></button><input type="file" id="fi" multiple hidden><textarea id="in" rows="1" placeholder="Tulis pesan atau lampirkan kode…" aria-label="Pesan"></textarea><button id="send" disabled>↑</button></form>
<small>AI bisa salah. Cek ulang info penting.</small></footer>
</main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const API='https://web-chatbot.mr-didinska21.workers.dev';
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const auth=()=>{const t=ls.get('tok',null);return t?{Authorization:'Bearer '+t}:{}};
let chats=ls.get('chats',[]),gone=ls.get('gone',{}),cur=null,busy=false,ctl=null,files=[],st;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
chats.forEach(c=>{if(!c.id){c.id=uid();c.ts=Date.now()}});
const SUG=[["Buat skrip","Buatkan skrip Python untuk rename banyak file sekaligus"],["Cari bug","Cari bug di kode yang akan saya lampirkan"],["Jelaskan kode","Jelaskan cara kerja kode yang saya lampirkan"],["Buat proyek","Buatkan proyek Node.js dengan Express lengkap dengan semua filenya"]];
const SYS='Kamu asisten coding. Jawab dalam bahasa Indonesia, ringkas dan teknis. Berikan kode lengkap yang siap dijalankan, jangan dipotong dengan tanda titik-titik. Tulis setiap file dalam blok kode terpisah dengan format ```bahasa:namafile.ext (contoh ```python:bot.py atau ```mq5:EA.mq5). Jika ada file terlampir, rujuk namanya.';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EXT={python:'py',py:'py',javascript:'js',js:'js',node:'js',nodejs:'js',typescript:'ts',ts:'ts',mq5:'mq5',mql5:'mq5',mq4:'mq4',mql4:'mq4',cpp:'cpp','c++':'cpp',c:'c',cs:'cs',csharp:'cs',java:'java',go:'go',rust:'rs',php:'php',json:'json',html:'html',css:'css',bash:'sh',sh:'sh',sql:'sql',yaml:'yml',yml:'yml',markdown:'md',md:'md',text:'txt',txt:'txt',env:'env',ini:'ini'};
const LM={mq5:'cpp',mql5:'cpp',mq4:'cpp',mql4:'cpp',node:'javascript',nodejs:'javascript',env:'ini',text:'plaintext',txt:'plaintext'};
function codeBlock(info,code,fin){
 const lang=(info.split(/[\s:]/)[0]||'').toLowerCase();
 let name=(info.match(/[\w\-]+\.[A-Za-z0-9]+/)||[])[0];
 if(!name)name='kode.'+(EXT[lang]||lang||'txt');
 let h=esc(code);
 if(fin&&window.hljs){
  const L=[lang,name.split('.').pop().toLowerCase()].map(x=>LM[x]||x).find(x=>x&&hljs.getLanguage(x));
  if(L){try{h=hljs.highlight(code,{language:L,ignoreIllegals:true}).value}catch{}}
 }
 return '<div class="cb"><div class="ch"><span>'+esc(name)+'</span><button type="button" data-a="copy">Salin</button><button type="button" data-a="dl" data-n="'+esc(name)+'">Unduh</button></div><pre><code>'+h+'</code></pre></div>';
}
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function prose(t){
 let o='',ul=null;const end=()=>{if(ul){o+='</'+ul+'>';ul=null}};
 for(const l of t.split('\n')){
  let m;
  if(m=/^(#{1,3})\s+(.*)/.exec(l)){end();const n=m[1].length+1;o+='<h'+n+'>'+inl(m[2])+'</h'+n+'>'}
  else if(m=/^\s*(?:([-*])|\d+\.)\s+(.*)/.exec(l)){const k=m[1]?'ul':'ol';if(ul!==k){end();o+='<'+k+'>';ul=k}o+='<li>'+inl(m[2])+'</li>'}
  else if(!l.trim())end();
  else{end();o+='<p>'+inl(l)+'</p>'}
 }
 end();return o;
}
function md(t,fin){
 const parts=t.split(/```/);
 return parts.map((p,i)=>{
  if(i%2){const nl=p.indexOf('\n');return codeBlock(nl>-1?p.slice(0,nl).trim():'',nl>-1?p.slice(nl+1):p,fin)}
  return prose(p);
 }).join('')+(parts.length>=5&&parts.length%2===1?'<button type="button" class="zipall" data-a="zip">Unduh semua (.zip)</button>':'');
}
function renderChips(){const c=$('#chips');c.innerHTML='';files.forEach((f,i)=>{const x=document.createElement('span');x.className='chip';x.textContent=f.name+' ✕';x.onclick=()=>{files.splice(i,1);renderChips();fit()};c.appendChild(x)})}
$('#clip').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{for(const f of e.target.files){if(f.size>300000){alert(f.name+' terlalu besar (maks 300 KB).');continue}const t=await f.text();if(t.includes('\u0000')){alert(f.name+' bukan file teks/kode.');continue}files.push({name:f.name,text:t})}e.target.value='';renderChips();fit()};
async function zipAll(btn){
 if(!window.JSZip){alert('Library zip belum termuat. Coba lagi.');return}
 const z=new JSZip(),seen={};
 btn.parentElement.querySelectorAll('.cb').forEach(cb=>{const raw=cb.querySelector('.ch span').textContent;seen[raw]=(seen[raw]||0)+1;let n=raw;if(seen[raw]>1){const i=raw.lastIndexOf('.');n=i>0?raw.slice(0,i)+'_'+seen[raw]+raw.slice(i):raw+'_'+seen[raw]}z.file(n,cb.querySelector('code').textContent)});
 const blob=await z.generateAsync({type:'blob'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kode.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function save(){if(cur)cur.ts=Date.now();ls.set('chats',chats);ls.set('gone',gone);clearTimeout(st);st=setTimeout(sync,1500)}
function merge(a,b){
 const g={...a.gone};for(const k in b.gone)g[k]=Math.max(g[k]||0,b.gone[k]);
 const m=new Map();
 for(const c of [...a.chats,...b.chats]){const o=m.get(c.id);if(!o||c.ts>o.ts)m.set(c.id,c)}
 return {chats:[...m.values()].filter(c=>!(g[c.id]>=c.ts)).sort((x,y)=>y.ts-x.ts),gone:g};
}
async function sync(){
 if(busy){clearTimeout(st);st=setTimeout(sync,2500);return}
 try{
  const r=await fetch(API+'/api/chats',{headers:auth()});
  if(!r.ok)return;
  const raw=await r.text(),s=JSON.parse(raw);
  const m=merge({chats,gone},{chats:s.chats||[],gone:s.gone||{}});
  const id=cur&&cur.id,prev=JSON.stringify(cur&&cur.msgs);
  chats=m.chats;gone=m.gone;cur=id?chats.find(c=>c.id===id)||null:null;
  ls.set('chats',chats);ls.set('gone',gone);
  const out=JSON.stringify(m);
  if(out!==raw)await fetch(API+'/api/chats',{method:'PUT',headers:{'Content-Type':'application/json',...auth()},body:out});
  if(!busy){renderList();if(JSON.stringify(cur&&cur.msgs)!==prev)renderChat()}
 }catch{}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
function renderList(){
 $('#list').innerHTML='';
 chats.forEach(c=>{
  const b=document.createElement('button');b.className='item'+(c===cur?' on':'');
  b.innerHTML='<span>'+esc(c.title)+'</span><span class="x" role="button" aria-label="Hapus">✕</span>';
  b.onclick=e=>{if(e.target.classList.contains('x')){chats=chats.filter(x=>x!==c);gone[c.id]=Date.now();if(cur===c)cur=null;save();renderList();renderChat()}else{cur=c;renderList();renderChat();document.body.classList.remove('open')}};
  $('#list').appendChild(b);
 });
}
function renderChat(){
 const el=$('#chat');el.innerHTML='';
 if(!cur||!cur.msgs.length){
  el.className='col empty';
  el.innerHTML='<h1>Mau bikin <em>kode</em> apa hari ini?</h1><p>Tulis permintaan atau lampirkan kode. Obrolanmu tersimpan di perangkat ini.</p><div class="sugs"></div>';
  SUG.forEach(([a,q])=>{const b=document.createElement('button');b.className='sug';b.innerHTML='<b>'+esc(a)+'</b><small>'+esc(q)+'</small>';b.onclick=()=>send(q);el.lastChild.appendChild(b)});
  return;
 }
 el.className='col';
 cur.msgs.forEach(m=>addMsg(m.role,m.show??m.content,m.files));
 $('#scroll').scrollTop=1e9;
}
function addMsg(role,text,fl){
 const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');
 d.innerHTML=(role==='user'?'':'<div class="av">D</div>')+'<div class="b"></div>';
 const b=d.querySelector('.b');
 if(role==='user')b.textContent=(fl&&fl.length?fl.map(n=>'📎 '+n).join('\n')+'\n':'')+text;else b.innerHTML=md(text,true);
 $('#chat').appendChild(d);return b;
}
async function send(text){
 text=text.trim();if((!text&&!files.length)||busy)return;
 const att=files.splice(0);renderChips();
 const full=att.map(f=>'Berkas: '+f.name+'\n```\n'+f.text+'\n```').join('\n\n')+(att.length&&text?'\n\n':'')+text;
 const show=text||'(berkas terlampir)';
 if(!cur){cur={id:uid(),ts:Date.now(),title:(text||att[0].name).slice(0,40),msgs:[]};chats.unshift(cur)}
 cur.msgs.push({role:'user',content:full,show,files:att.map(f=>f.name)});
 save();renderList();
 if(cur.msgs.length===1)renderChat();else addMsg('user',show,att.map(f=>f.name));
 if($('#chat').classList.contains('empty'))renderChat();
 $('#in').value='';fit();setBusy(true);
 const b=addMsg('assistant','');b.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
 $('#scroll').scrollTop=1e9;
 let out='';ctl=new AbortController();
 try{
  const res=await fetch(API+'/api/chat',{method:'POST',signal:ctl.signal,
   headers:{'Content-Type':'application/json',...auth()},
   body:JSON.stringify({stream:true,messages:[{role:'system',content:SYS},...cur.msgs.map(({role,content})=>({role,content}))]})});
  if(res.status===401){ls.set('tok',null);showLock();throw new Error('Sesi berakhir. Masukkan PIN lagi.')}
  if(!res.ok)throw new Error('Server menjawab '+res.status+'. Periksa pengaturan API di Cloudflare.');
  const ct=res.headers.get('content-type')||'';
  if(ct.includes('event-stream')){
   const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
   for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){
     if(!l.startsWith('data:'))continue;const p=l.slice(5).trim();if(!p||p==='[DONE]')continue;
     try{const j=JSON.parse(p);out+=j.choices?.[0]?.delta?.content??j.delta?.text??''}catch{}
    }
    if(out){b.innerHTML=md(out,false);b.classList.add('cur')}
    $('#scroll').scrollTop=1e9;
   }
  }else{
   const j=await res.json();
   out=j.choices?.[0]?.message?.content??j.content?.[0]?.text??j.reply??j.text??JSON.stringify(j);
  }
  b.classList.remove('cur');b.innerHTML=md(out||'(kosong)',true);
  cur.msgs.push({role:'assistant',content:out});save();
 }catch(e){
  b.classList.remove('cur');
  if(e.name==='AbortError'){b.innerHTML=out?md(out,true):'';if(out){cur.msgs.push({role:'assistant',content:out});save()}else cur.msgs.pop()}
  else{b.innerHTML='<div class="err">'+esc(e.message||'Gagal terhubung ke API.')+'</div>';cur.msgs.pop();save()}
 }
 setBusy(false);$('#scroll').scrollTop=1e9;
}
function setBusy(v){busy=v;$('#send').textContent=v?'■':'↑';$('#send').disabled=!v&&!$('#in').value.trim()&&!files.length}
function fit(){const t=$('#in');t.style.height='auto';t.style.height=t.scrollHeight+'px';$('#send').disabled=!busy&&!t.value.trim()&&!files.length}
$('#in').addEventListener('input',fit);
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(max-width:760px)').matches){e.preventDefault();$('#form').requestSubmit()}});
$('#form').onsubmit=e=>{e.preventDefault();if(busy){ctl&&ctl.abort();return}send($('#in').value)};
$('#new').onclick=()=>{cur=null;renderList();renderChat();document.body.classList.remove('open');$('#in').focus()};
$('#menu').onclick=()=>document.body.classList.toggle('open');
$('#ov').onclick=()=>document.body.classList.remove('open');
const thLabel=()=>{$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'☀  Mode terang':'☾  Mode gelap'};
$('#theme').onclick=()=>{const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;ls.set('theme',n);thLabel()};
thLabel();
$('#chat').addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 if(b.dataset.a==='zip'){zipAll(b);return}
 const code=b.closest('.cb').querySelector('code').textContent;
 if(b.dataset.a==='copy'){navigator.clipboard.writeText(code).then(()=>{b.textContent='Tersalin ✓';setTimeout(()=>b.textContent='Salin',1500)}).catch(()=>{})}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain;charset=utf-8'}));a.download=b.dataset.n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
});
function showLock(){$('#lock').classList.add('on');$('#pin').value='';setTimeout(()=>$('#pin').focus(),50)}
$('#lf').onsubmit=async e=>{
 e.preventDefault();$('#le').textContent='';
 try{
  const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('#pin').value})});
  if(r.ok){const j=await r.json();ls.set('tok',j.token);$('#lock').classList.remove('on');$('#in').focus();sync()}
  else{$('#le').textContent='PIN salah. Coba lagi.';$('#pin').value='';$('#pin').focus()}
 }catch{$('#le').textContent='Tidak bisa terhubung ke server.'}
};
fetch(API+'/api/session',{headers:auth()}).then(r=>{if(r.status===401)showLock();else sync()}).catch(()=>{});
renderList();renderChat();
</script>
</body></html>
