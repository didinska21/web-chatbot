const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EXT={python:'py',py:'py',javascript:'js',js:'js',node:'js',nodejs:'js',typescript:'ts',ts:'ts',mq5:'mq5',mql5:'mq5',mq4:'mq4',mql4:'mq4',cpp:'cpp','c++':'cpp',c:'c',cs:'cs',csharp:'cs',java:'java',go:'go',rust:'rs',php:'php',json:'json',html:'html',css:'css',bash:'sh',sh:'sh',sql:'sql',yaml:'yml',yml:'yml',markdown:'md',md:'md',text:'txt',txt:'txt',env:'env',ini:'ini'};
const LM={mq5:'cpp',mql5:'cpp',mq4:'cpp',mql4:'cpp',node:'javascript',nodejs:'javascript',env:'ini',text:'plaintext',txt:'plaintext'};
function codeBlock(info,code,fin){
 const lang=(info.split(/[\s:]/)[0]||'').toLowerCase();
 let name=(info.match(/[\w\-]+\.[A-Za-z0-9]+/)||[])[0];
 if(!name)name='kode.'+(EXT[lang]||lang||'txt');
 let h=esc(code);
 if(fin&&window.hljs){
  const L=[lang,name.split('.').pop().toLowerCase()].map(x=>LM[x]||x).find(x=>x&&hljs.getLanguage(x));
  if(L){try{h=hljs.highlight(code,{language:L,ignoreIllegals:true}).value}catch{}}
 }
 return '<div class="cb"><div class="ch"><span>'+esc(name)+'</span><button type="button" data-a="copy">Salin</button><button type="button" data-a="dl" data-n="'+esc(name)+'">Unduh</button></div><pre><code>'+h+'</code></pre></div>';
}
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function prose(t){
 let o='',ul=null;const end=()=>{if(ul){o+='</'+ul+'>';ul=null}};
 for(const l of t.split('\n')){
  let m;
  if(m=/^(#{1,3})\s+(.*)/.exec(l)){end();const n=m[1].length+1;o+='<h'+n+'>'+inl(m[2])+'</h'+n+'>'}
  else if(m=/^\s*(?:([-*])|\d+\.)\s+(.*)/.exec(l)){const k=m[1]?'ul':'ol';if(ul!==k){end();o+='<'+k+'>';ul=k}o+='<li>'+inl(m[2])+'</li>'}
  else if(!l.trim())end();
  else{end();o+='<p>'+inl(l)+'</p>'}
 }
 end();return o;
}
function md(t,fin){
 const parts=t.split(/```/);
 return parts.map((p,i)=>{
  if(i%2){const nl=p.indexOf('\n');return codeBlock(nl>-1?p.slice(0,nl).trim():'',nl>-1?p.slice(nl+1):p,fin)}
  return prose(p);
 }).join('')+(parts.length>=5&&parts.length%2===1?'<button type="button" class="zipall" data-a="zip">Unduh semua (.zip)</button>':'');
}

function merge(a,b){
 const g={...a.gone};for(const k in b.gone)g[k]=Math.max(g[k]||0,b.gone[k]);
 const m=new Map();
 for(const c of [...a.chats,...b.chats]){const o=m.get(c.id);if(!o||c.ts>o.ts)m.set(c.id,c)}
 return {chats:[...m.values()].filter(c=>!(g[c.id]>=c.ts)).sort((x,y)=>y.ts-x.ts),gone:g};
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let tyTok=0;
async function typeLoop(cards){
 const tok=++tyTok,alive=()=>tok===tyTok&&cards[0].isConnected;
 const T=cards.map(c=>c.querySelector('.t')),H=cards.map(c=>c.querySelector('.h')),full=SUG.map(x=>x[1]);
 const set=(i,n)=>{T[i].textContent=full[i].slice(0,n);H[i].textContent=full[i].slice(n)};
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){full.forEach((x,i)=>set(i,x.length));return}
 await sleep(600);
 while(alive()){
  for(let i=0;i<cards.length;i++){
   if(!alive())return;
   cards[i].classList.add('on');
   for(let n=1;n<=full[i].length;n++){set(i,n);await sleep(/[,.]/.test(full[i][n-1])?170:24+Math.random()*26);if(!alive())return}
   await sleep(350);cards[i].classList.remove('on');
  }
  await sleep(2600);
  let left=full.map(x=>x.length);
  while(left.some(x=>x>0)){left=left.map((x,i)=>{const v=Math.max(0,x-3);set(i,v);return v});await sleep(18);if(!alive())return}
  await sleep(500);
 }
}

class ApiErr extends Error{constructor(info){super(info.message);this.info=info}}
async function readErr(res){let j=null;try{j=await res.json()}catch{}const e=j&&j.error;if(e&&e.code)return e;return{code:'http_'+res.status,source:'worker',message:'Server menjawab '+res.status+(res.statusText?' '+res.statusText:''),hint:'Balasan bukan dari Worker versi terbaru. Deploy ulang Worker lalu coba lagi.'}}
const SRC={auth:'Sesi / PIN',config:'Konfigurasi Worker',worker:'Worker',upstream:'Provider API',network:'Jaringan / CORS',client:'Halaman (browser)'};
function errBox(i){return '<div class="err"><b>'+esc(SRC[i.source]||i.source||'Error')+'</b> — '+esc(i.message||'')+(i.hint?'<br><small>'+esc(i.hint)+'</small>':'')+'<br><small class="ec">kode: '+esc(i.code||'?')+(i.upstream_status?' · provider: '+i.upstream_status:'')+(i.rid?' · ref: '+esc(i.rid):'')+'</small></div>'}
function toInfo(e){
 if(e instanceof ApiErr)return e.info;
 if(e instanceof TypeError&&/fetch|network|load failed/i.test(e.message))return{code:'network',source:'network',message:'Browser tidak bisa menghubungi Worker.',hint:'Cek koneksi internet, alamat API di index.html, dan ALLOWED_ORIGINS di Worker ('+location.origin+' harus terdaftar).'};
 return{code:'client',source:'client',message:e.message||'Kesalahan di halaman.',hint:'Buka Console browser untuk detail.'};
}
async function send(text){
 text=text.trim();if((!text&&!files.length)||busy)return;
 const att=files.splice(0);renderChips();
 const full=att.map(f=>'Berkas: '+f.name+'\n```\n'+f.text+'\n```').join('\n\n')+(att.length&&text?'\n\n':'')+text;
 const show=text||'(berkas terlampir)';
 if(!cur){cur={id:uid(),ts:Date.now(),title:(text||att[0].name).slice(0,40),msgs:[]};chats.unshift(cur)}
 cur.msgs.push({role:'user',content:full,show,files:att.map(f=>f.name)});
 save();renderList();
 if(cur.msgs.length===1)renderChat();else addMsg('user',show,att.map(f=>f.name));
 if($('#chat').classList.contains('empty'))renderChat();
 $('#in').value='';fit();setBusy(true);
 const b=addMsg('assistant','');b.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
 $('#scroll').scrollTop=1e9;
 let out='';ctl=new AbortController();
 try{
  const res=await fetch(API+'/api/chat',{method:'POST',signal:ctl.signal,
   headers:{'Content-Type':'application/json',...auth()},
   body:JSON.stringify({stream:true,...(ls.get('model','')?{model:ls.get('model','')}:{}),messages:[{role:'system',content:SYS},...cur.msgs.map(({role,content})=>({role,content}))]})});
  if(!res.ok){const e=await readErr(res);if(e.code==='session_invalid'||e.code==='http_401'){ls.set('tok',null);showLock()}throw new ApiErr(e)}
  const ct=res.headers.get('content-type')||'';
  if(ct.includes('event-stream')){
   const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
   for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){
     if(!l.startsWith('data:'))continue;const p=l.slice(5).trim();if(!p||p==='[DONE]')continue;
     let j;try{j=JSON.parse(p)}catch{continue}
     if(j.error)throw new ApiErr({code:'upstream_stream_error',source:'upstream',message:'Provider mengirim error di tengah stream: '+String(j.error.message||JSON.stringify(j.error)).slice(0,300),hint:'Coba lagi atau ganti model.'});
     out+=j.choices?.[0]?.delta?.content??j.delta?.text??'';
    }
    if(out){b.innerHTML=md(out,false);b.classList.add('cur')}
    $('#scroll').scrollTop=1e9;
   }
  }else{
   const j=await res.json();
   if(j.error)throw new ApiErr({code:'upstream_body_error',source:'upstream',message:String(j.error.message||JSON.stringify(j.error)).slice(0,300),hint:'Cek model dan API key.'});
   out=j.choices?.[0]?.message?.content??j.content?.[0]?.text??j.reply??j.text??JSON.stringify(j);
  }
  if(!out)console.warn('[chat] provider membalas tanpa isi',res.status,ct);
  b.classList.remove('cur');b.innerHTML=md(out||'(kosong)',true);
  cur.msgs.push({role:'assistant',content:out});save();
 }catch(e){
  b.classList.remove('cur');
  if(e.name==='AbortError'){b.innerHTML=out?md(out,true):'';if(out){cur.msgs.push({role:'assistant',content:out});save()}else cur.msgs.pop()}
  else{const info=toInfo(e);console.error('[chat]',info,e);b.innerHTML=errBox(info);cur.msgs.pop();save();$('#in').value=text;files.unshift(...att);renderChips();fit()}
 }
 setBusy(false);$('#scroll').scrollTop=1e9;
}

$('#navfx').onclick=()=>{if(document.body.classList.contains('fxon')){document.body.classList.remove('open');return}fxOpen()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.body.classList.contains('fxon')&&Date.now()-FX.at>45000)fxLoad()});
function fxRender(){
 const d=FX.data,tfm=FXTF.find(x=>x[0]===FX.tf),st=$('#fxs'),cl=$('#fxch');
 FX.vis=d?d.values.slice(-(($('#fxc').clientWidth||400)<520?70:100)):[];
 if(!d||!FX.vis.length){
  $('#fxpx').textContent='—';cl.textContent='—';cl.className='';['fxhi','fxlo','fxop'].forEach(i=>$('#'+i).textContent='—');
  if(!$('#fxe').innerHTML)st.innerHTML='<i class="d"></i><span>Memuat…</span>';else st.innerHTML='<i class="d"></i><span>Data belum tersedia</span>';
  $('#fxn').textContent='';fxDraw();fxTip();return;
 }
 const v=FX.vis,last=v[v.length-1],first=v[0],hi=Math.max(...v.map(x=>x.h)),lo=Math.min(...v.map(x=>x.l)),ch=last.c-first.o,pc=ch/first.o*100;
 $('#fxpx').textContent=fxNum(last.c);
 cl.textContent=(ch>=0?'+':'−')+fxNum(Math.abs(ch))+' ('+(ch>=0?'+':'−')+Math.abs(pc).toFixed(2)+'%) dalam '+v.length+' candle';cl.className=ch>=0?'up':'dn';
 $('#fxhi').textContent=fxNum(hi);$('#fxlo').textContent=fxNum(lo);$('#fxop').textContent=fxNum(first.o);
 const now=fxNow(),lag=(now.ms-fxP(last.t))/60000,late=lag>tfm[2]*2+10;
 st.innerHTML=late?'<i class="d"></i><span>Pasar tutup atau data tertunda. Candle terakhir '+esc(fxT(last.t,true))+' WIB</span>':'<i class="d on"></i><span>Diperbarui '+now.txt+' WIB'+(d.cached&&d.age>5?' (cache '+d.age+' dtk)':'')+'</span>';
 if(d.stale)st.innerHTML='<i class="d"></i><span>Data lama, Twelve Data sedang gagal dihubungi</span>';
 const cr=d.credits&&d.credits.left!=null?' Sisa kredit hari ini: '+d.credits.left+'.':'';
 $('#fxn').textContent='Data dari Twelve Data, waktu dalam WIB. Diperbarui otomatis tiap 60 detik selama halaman ini terbuka, maksimal 1 kredit per pembaruan.'+cr+' Bukan saran investasi.';
 $('#fxcv').setAttribute('aria-label','Grafik candlestick XAU/USD, harga terakhir '+fxNum(last.c)+', rentang '+tfm[1]);
 if(FX.sel>=v.length)FX.sel=-1;
 fxDraw();fxTip();
}
function fxTip(){
 const el=$('#fxtip'),v=FX.vis;
 if(FX.sel<0||!v[FX.sel]){el.innerHTML=v.length?'<span>Sentuh atau geser di grafik untuk melihat detail candle.</span>':'';return}
 const c=v[FX.sel];el.innerHTML='<span><b>'+esc(fxT(c.t,true))+'</b></span><span>O <b>'+fxNum(c.o)+'</b></span><span>H <b>'+fxNum(c.h)+'</b></span><span>L <b>'+fxNum(c.l)+'</b></span><span>C <b style="color:var(--'+(c.c>=c.o?'up':'dn')+')">'+fxNum(c.c)+'</b></span>';
}
function fxDraw(){
 const cv=$('#fxcv'),box=$('#fxc'),W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
 const dpr=Math.min(devicePixelRatio||1,3);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim(),mu=col('--mu'),tx=col('--tx'),UP=col('--up'),DN=col('--dn');
 const grid=cs.getPropertyValue('--tx').trim()?'color-mix(in srgb,'+tx+' 10%,transparent)':'rgba(128,128,128,.15)';
 const F='11px "Space Mono",ui-monospace,monospace';g.font=F;
 const v=FX.vis;
 if(!v.length){g.fillStyle=mu;g.textAlign='center';g.textBaseline='middle';g.fillText($('#fxe').innerHTML?'Grafik belum bisa ditampilkan':'Memuat data…',W/2,H/2);return}
 const {l:pl,r:pr,t:pt,b:pb}=FXPAD,pw=W-pl-pr,ph=H-pt-pb,n=v.length,cw=pw/n;
 let lo=Math.min(...v.map(x=>x.l)),hi=Math.max(...v.map(x=>x.h));const pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
 const y=p=>pt+(hi-p)/(hi-lo)*ph,x=i=>pl+(i+.5)*cw,lyy=y(v[n-1].c);
 // grid + skala harga
 g.textBaseline='middle';g.textAlign='left';
 for(let k=0;k<=4;k++){const p=hi-(hi-lo)*k/4,yy=pt+ph*k/4;g.strokeStyle=grid;g.lineWidth=1;g.beginPath();g.moveTo(pl,Math.round(yy)+.5);g.lineTo(pl+pw,Math.round(yy)+.5);g.stroke();if(Math.abs(yy-lyy)>17){g.fillStyle=mu;g.fillText(fxNum(p),pl+pw+6,Math.min(H-pb-6,Math.max(pt+6,yy)))}}
 // label waktu
 g.textBaseline='alphabetic';
 for(let k=0;k<=4;k++){const i=Math.round(k*(n-1)/4);g.fillStyle=mu;g.textAlign=k===0?'left':k===4?'right':'center';g.fillText(fxT(v[i].t),k===0?pl:k===4?pl+pw:x(i),H-7)}
 // candle
 const bw=Math.max(1,Math.floor(cw*.66));
 v.forEach((c,i)=>{const up=c.c>=c.o,k=up?UP:DN,cx=Math.round(x(i))+.5;g.strokeStyle=k;g.fillStyle=k;g.lineWidth=1;g.beginPath();g.moveTo(cx,y(c.h));g.lineTo(cx,y(c.l));g.stroke();const t=y(Math.max(c.o,c.c)),h=Math.max(1,Math.abs(y(c.o)-y(c.c)));g.fillRect(Math.round(x(i)-bw/2),t,bw,h)});
 // garis harga terakhir
 const last=v[n-1],ly=y(last.c),lk=last.c>=last.o?UP:DN;
 g.save();g.setLineDash([4,3]);g.strokeStyle=lk;g.globalAlpha=.8;g.beginPath();g.moveTo(pl,Math.round(ly)+.5);g.lineTo(pl+pw,Math.round(ly)+.5);g.stroke();g.restore();
 const lt=fxNum(last.c),tw=g.measureText(lt).width+10;g.fillStyle=lk;g.beginPath();g.roundRect?g.roundRect(pl+pw+2,ly-9,tw,18,5):g.rect(pl+pw+2,ly-9,tw,18);g.fill();
 g.fillStyle='#fff';g.textAlign='left';g.textBaseline='middle';g.fillText(lt,pl+pw+7,ly+.5);
 // crosshair
 if(FX.sel>=0&&v[FX.sel]){const c=v[FX.sel],cx=Math.round(x(FX.sel))+.5,cy=y(c.c);g.save();g.setLineDash([3,3]);g.strokeStyle=tx;g.globalAlpha=.55;g.beginPath();g.moveTo(cx,pt);g.lineTo(cx,pt+ph);g.moveTo(pl,Math.round(cy)+.5);g.lineTo(pl+pw,Math.round(cy)+.5);g.stroke();g.restore();g.fillStyle=tx;g.beginPath();g.arc(cx,cy,3,0,7);g.fill()}
}
(()=>{
 const cv=$('#fxcv'),idx=e=>{const r=cv.getBoundingClientRect(),n=FX.vis.length,pw=r.width-FXPAD.l-FXPAD.r;return n?Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left-FXPAD.l)/pw*n))):-1};
 const mv=e=>{const i=idx(e);if(i!==FX.sel){FX.sel=i;fxDraw();fxTip()}};
 cv.addEventListener('pointerdown',mv);cv.addEventListener('pointermove',mv);
 cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&FX.sel>=0){FX.sel=-1;fxDraw();fxTip()}});
 let raf=0;new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(document.body.classList.contains('fxon'))fxRender()})}).observe($('#fxc'));
 new MutationObserver(()=>{if(document.body.classList.contains('fxon'))fxDraw()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
fillModels([],'');
fetch(API+'/api/session',{headers:auth()}).then(r=>{if(r.status===401)showLock();else{sync();loadModels()}}).catch(e=>console.warn('[session] tidak bisa menghubungi Worker',e));
renderList();renderChat();
</script>
</body></html>
